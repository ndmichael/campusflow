<!DOCTYPE html>
{% load static %}
{% load crispy_forms_tags %}
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" crossorigin="anonymous">
    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css" rel="stylesheet">
    <link rel="stylesheet" href="{% static 'pages/css/style.css' %}">
</head>
<body>
    <section id="login" class="py-5">
        <div class="container py-4">
            <section class="row">
                <div class="col-12 col-md-6 mx-auto align-items-center">

                </div>
            </section>

            <section class="row justify-content-center align-items-center g-5">
                <div class="col-12 col-md-5">
                    <legend>
                        <i class="bi bi-sheild-lock-fill me-2"></i> Secured Login
                    </legend>
                    <h1 class="fw-bold mt-4">
                        Welcome Back
                    </h1>
                    <p>
                        Student management system
                    </p>
                </div>
            </section>

            <section class="row">
                <div class="col-12 col-md-6 mx-auto">
                    <form action="" method="post">
                        {% csrf_token %}
                        {{form | crispy}}

                        {% if next %}
                        <input type="hidden" name="next" value="{{next}}">
                        {% endif %}
                        <button type="submit" class="btn-primary btn-lg w-100 mt-3">
                            Login Now
                        </button>
                    </form>
                </div>
            </section>
        </div>
    </section>


    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js" integrity="sha384-FKyoEForCGlyvwx9Hj09JcYn3nv7wiPVlz7YYwJrWVcXK/BmnVDxM+D2scQbITxI" crossorigin="anonymous"></script>
</body>
</html>
